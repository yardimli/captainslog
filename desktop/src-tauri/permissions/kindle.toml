[[permission]]
identifier = "allow-kindle-book-observed"
description = "Allows the restricted Kindle Cloud Reader window to report a manually selected library title."
commands.allow = ["kindle_book_observed"]

[[permission]]
identifier = "allow-kindle-manual-sync-ready"
description = "Allows the restricted Kindle library window to consume a one-time manual sync request."
commands.allow = ["kindle_manual_sync_ready"]

[[permission]]
identifier = "allow-kindle-status-observed"
description = "Allows the restricted Kindle Cloud Reader window to report connection status to the desktop host."
commands.allow = ["kindle_status_observed"]
